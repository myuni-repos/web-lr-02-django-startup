<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Блог</title>
</head>
<body>
    <h1>Список статей</h1>
    
    <div class="posts">
        {% for post in posts %}
            <article>
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
                <small>Автор: {{ post.author }} | Дата: {{ post.date }}</small>
                <hr>
            </article>
        {% empty %}
            <p>Статей пока нет.</p>
        {% endfor %}
    </div>
</body>
</html>
